<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wordstack</title>
<meta name="description" content="Swipe-style flash cards for learning languages." />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#e4e9f1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Wordstack" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">
  <header class="top">
    <button class="lang-btn" id="langBtn" data-act="langs" aria-label="Choose language">
      <span class="badge" id="langBadge">··</span>
      <span class="lname" id="langName">Wordstack</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="meters">
      <span class="chip-stat streak" id="streakChip" title="Day streak">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5-1.5 5.5-1.5 8 0 1.4 1 2.5 2.3 2.5 1.6 0 2.2-1.4 2-3 2.4 1.6 4.2 4.3 4.2 7.3A7 7 0 0 1 12 23a7 7 0 0 1-7-6.2C5 12 9.5 9 12 2z"/></svg>
        <span id="streakN">0</span>
      </span>
      <span class="chip-stat level" id="levelChip" title="Level">Lv <span id="levelN">1</span></span>
    </div>
  </header>
  <main id="view"><div class="loading">Opening your decks…</div></main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="practice" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="15" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v13"/></svg>
      Practice
    </button>
    <button data-tab="words">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Words
    </button>
    <button data-tab="progress">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Progress
    </button>
  </nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>

<script src="app.js"></script>
</body>
</html>
